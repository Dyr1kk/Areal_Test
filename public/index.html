<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HR Система — Учёт сотрудников</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>HR Система управления сотрудниками</h1>

    <!-- Форма добавления -->
    <section class="form-section">
      <h2>Добавить нового сотрудника</h2>
      <form id="employeeForm">
        <input type="text" id="full_name" placeholder="ФИО" required />
        <input type="date" id="birth_date" />
        <input type="text" id="passport" placeholder="Паспорт (1234 567890)" maxlength="20" />
        <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" maxlength="18" />
        <input type="email" id="email" placeholder="Email" />
        <input type="text" id="address" placeholder="Адрес проживания" />
        <input type="text" id="department" placeholder="Отдел" required />
        <input type="text" id="position" placeholder="Должность" required />
        <input type="number" id="salary" placeholder="Зарплата" step="0.01" min="0" />
        <input type="date" id="hire_date" required />
        <button type="submit">Добавить</button>
      </form>
    </section>

    <!-- Фильтры и поиск -->
    <section class="controls">
      <input type="text" id="searchInput" placeholder="Поиск по ФИО..." />
      <input type="text" id="filterDept" placeholder="Фильтр: отдел" />
      <input type="text" id="filterPos" placeholder="Фильтр: должность" />
      <button id="applyFilters">Применить фильтры</button>
      <button id="resetFilters">Сбросить</button>
    </section>

    <!-- Таблица сотрудников -->
    <section class="table-section">
      <h2>Список сотрудников</h2>
      <table id="employeesTable">
        <thead>
          <tr>
            <th>ФИО</th>
            <th>Дата рождения</th>
            <th>Паспорт</th>
            <th>Телефон</th>
            <th>Email</th>
            <th>Адрес</th>
            <th>Отдел</th>
            <th>Должность</th>
            <th>Зарплата</th>
            <th>Принят</th>
            <th>Статус</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="employeesBody"></tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
